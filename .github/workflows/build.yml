name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the PDFs to (recovery only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pdfs:
    name: Compile PDFs (es, en)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            es/main.tex
            en/main.tex
          work_in_root_file_dir: true

      - name: Fail on undefined references or citations
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Rerun to get" es/main.log en/main.log; then
            exit 1
          fi

      - name: Name the PDFs
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then V="$TAG"; else V="$(git rev-parse --short HEAD)"; fi
          mkdir -p dist
          cp es/main.pdf "dist/Cepeda_TFG-Fisica_borrador_${V}_es.pdf"
          cp en/main.pdf "dist/Cepeda_Physics-thesis_draft_${V}_en.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          retention-days: 7

      - name: Attach the PDFs to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.pdf --clobber

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('code/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run the tests
        if: hashFiles('code/pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e "code[test]"
          pytest code -q
